    content="GDGLexi - Chương trình luyện thi IELTS & VSTEP lớp nhỏ dành cho sinh viên và người đi làm, được tài trợ và trực thuộc Google Developer Groups on Campus - DUT tại ĐH Bách Khoa Đà Nẵng."

  />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('gdglexi_theme');
        var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = isDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (isDark) document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

    rel="stylesheet"
  />
